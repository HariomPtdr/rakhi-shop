# ════════════════════════════════════════════════════════════════════
#  Netlify
#
#  Netlify runs build.py, which reads SUPABASE_URL and
#  SUPABASE_ANON_KEY from the site's environment variables and writes
#  them into the pages it produces. Set them once in
#      Site configuration → Environment variables
#  and every deploy from then on picks them up. They are never in git.
#
#  Python 3 is on Netlify's build image already; there is nothing to
#  install and no node_modules.
# ════════════════════════════════════════════════════════════════════

[build]
  command = "python3 build.py"
  publish = "dist"

# The shop and the dashboard are two ordinary files. Nothing is
# server-rendered, so there is nothing to rewrite.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"

# The dashboard's noindex rule is written into dist/_headers by build.py,
# because only the build knows where ADMIN_PATH put it. Naming the path
# here would put it in the repository, which is the thing to avoid.

# Fonts and photos are content-addressed by their own names and change
# only when replaced, so they can be cached hard. The two pages must not
# be: a price change has to reach the next visitor.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=300, must-revalidate"


# ── the two payment endpoints ──
# Razorpay needs a server for exactly two things: making an order with the
# real amount, and checking the signature afterwards. Both need the key
# secret, which is why neither can live in the page. Node 18 has fetch and
# crypto built in, so there is nothing to install here either.
#
# Set in Site configuration → Environment variables:
#     RAZORPAY_KEY_ID             rzp_test_… or rzp_live_…
#     RAZORPAY_KEY_SECRET         never anywhere else
#     RAZORPAY_WEBHOOK_SECRET     a different string, set when the webhook
#                                 is created in Razorpay's dashboard
#     SUPABASE_SERVICE_ROLE_KEY   so a paid order can be marked paid
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The shop asks for /api/<name> wherever it is hosted, so that one line of
# it does not have to know which host is answering. Here that is this
# host's own functions; on AWS it is a rewrite onto the Lambda.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true
