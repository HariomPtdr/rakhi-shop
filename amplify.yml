# ════════════════════════════════════════════════════════════════════
#  AWS Amplify Hosting
#
#  Amplify runs build.py, which reads SUPABASE_URL, SUPABASE_ANON_KEY
#  and ADMIN_PATH from the app's environment variables and writes them
#  into the pages it produces. Set them once in
#      App settings → Environment variables
#  and every build from then on picks them up. They are never in git.
#
#  Python 3 is on Amplify's build image already; there is nothing to
#  install and no node_modules. If a build ever fails saying python3 is
#  not found, add `dnf install -y python3` as the first preBuild command.
#
#  The three payment endpoints are NOT here. They are one Lambda behind
#  a Function URL, reached at /api/* through the rewrite in
#      App settings → Rewrites and redirects
#  so the browser only ever talks to this domain. See aws/README.md.
# ════════════════════════════════════════════════════════════════════
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - python3 --version
    build:
      commands:
        - python3 build.py
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths: []

# ── headers ──
# They are NOT here. Amplify reads customHttp.yml in the repository root
# for those, and the customHeaders block this file used to accept is
# deprecated — written here it is silently ignored, which is how the shop
# went live for a few minutes with no security headers at all.
